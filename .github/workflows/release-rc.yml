name: Publish local V1 release candidate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish vetted local release candidate
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source, version and public repository before publication
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$QUALIFIED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "false"
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["version"] == "0.1.0rc1", "release package version mismatch"
          assert project["license"] == "Apache-2.0", "release license mismatch"
          assert "LICENSE" in project["license-files"], "release licence file missing"
          lock = tomllib.loads(Path("uv.lock").read_text())
          this = [package for package in lock["package"] if package["name"] == project["name"]]
          assert len(this) == 1 and this[0]["version"] == "0.1.0rc1", "locked project version mismatch"
          assert Path("docs/release-0.1.0-rc.1.md").is_file(), "release notes missing"
          PY
      - name: Publish one immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-rc.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; no mutation"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag exists without release; refusing to overwrite or repoint"
            exit 1
          fi
          {
            cat docs/release-0.1.0-rc.1.md
            printf '\n## Qualifying hosted CI run\n\n'
            printf 'The exact tagged commit was qualified by [GitHub Actions run %s](https://github.com/%s/actions/runs/%s) with a successful CI conclusion on main.\n' "$QUALIFIED_RUN_ID" "$GITHUB_REPOSITORY" "$QUALIFIED_RUN_ID"
          } > "$RUNNER_TEMP/local-v1-release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$QUALIFIED_SHA" --title "v0.1.0-rc.1 — Local V1 (Salesforce/MuleSoft acceptance pending)" --notes-file "$RUNNER_TEMP/local-v1-release-notes.md" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish --jq '{tag: .tagName, prerelease: .isPrerelease, target: .targetCommitish}'
