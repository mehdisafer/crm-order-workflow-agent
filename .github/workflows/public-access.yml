name: Anonymous public artifact reachability

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-access:
    name: Anonymous public reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify public endpoints without browser, cookies or bearer tokens
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/check_public_access.py --sha "$SOURCE_SHA" --output evidence-local/public-access.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: anonymous-public-access-${{ github.sha }}
          path: evidence-local/public-access.json
          if-no-files-found: error
          retention-days: 14
