[project]
name = "crm-order-workflow-agent"
version = "0.1.0"
description = "Auditable order-exception workflows with Temporal, Salesforce and MuleSoft"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "temporalio>=1.10,<2",
  "prometheus-client>=0.21,<1",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pip-audit>=2.9,<3", "pip-licenses>=5,<6", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_workflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["temporal: executes a real Temporal test server", "vendor: requires an explicitly authorised Salesforce sandbox and MuleSoft runtime", "load: bounded local load exercise"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
