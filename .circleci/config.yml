version: 2.1
jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - crm-uv-v1-{{ checksum "uv.lock" }}
      - run:
          name: Install locked Python environment
          command: |
            python -m pip install --disable-pip-version-check uv==0.13.6
            uv sync --locked
      - save_cache:
          key: crm-uv-v1-{{ checksum "uv.lock" }}
          paths:
            - .venv
            - ~/.cache/uv
      - run:
          name: Lint
          command: uv run ruff check . && uv run ruff format --check .
      - run:
          name: Diagnose test suite
          command: circleci testsuite doctor "python-core"
      - run:
          name: Run test suite
          command: circleci testsuite run "python-core"
      - store_test_results:
          path: test-results
workflows:
  build-and-test:
    jobs:
      - build-and-test
